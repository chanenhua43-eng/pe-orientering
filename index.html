<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘉義棒球歷史與 KANO 探索學習</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #1b4332;
        }
        .section {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 5px solid #2d6a4f;
            border-radius: 4px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #2d6a4f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1b4332;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            color: #2d6a4f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>嘉義棒球歷史與 KANO 探索</h1>
    
    <!-- 學生身分登錄 -->
    <div class="section">
        <label for="studentId"><strong>請輸入您的姓名或學號：</strong></label>
        <input type="text" id="studentId" placeholder="例如：張小明 (或 組別A)">
    </div>

    <!-- 學習內容模組 -->
    <div class="section">
        <h2>1. KANO 隊史簡介</h2>
        <p>嘉義農林棒球隊（簡稱 <strong>KANO</strong>，源自日文發音 <em>Kagi Nōrin</em>）於 1931 年打進日本甲子園大會，奪得準優勝（亞軍），締造台灣棒球史上極具代表性的傳奇紀錄。</p>
        <button onclick="logAction('閱讀資料', '學生閱讀了 KANO 隊史簡介')">標記為已閱讀</button>
    </div>

    <!-- 互動測驗模組 -->
    <div class="section">
        <h2>2. 隨堂小測驗</h2>
        <p>問題：嘉農棒球隊代表台灣打進甲子園並獲得亞軍，其英文名稱縮寫為何？</p>
        <select id="quizAnswer">
            <option value="">-- 請選擇答案 --</option>
            <option value="CYAA">CYAA</option>
            <option value="KANO">KANO</option>
            <option value="TPE">TPE</option>
            <option value="CBON">CBON</option>
        </select>
        <br><br>
        <button onclick="submitQuiz()">提交答案</button>
        <div id="quizFeedback" class="feedback"></div>
    </div>

    <!-- 思考與反思 -->
    <div class="section">
        <h2>3. 學習心得與反思</h2>
        <label for="reflection">看完 KANO 的故事，你覺得「永不放棄」的精神在現代體育運動中扮演什麼角色？</label>
        <input type="text" id="reflection" placeholder="寫下你的看法...">
        <br><br>
        <button onclick="submitReflection()">送出心得</button>
        <div id="reflectionFeedback" class="feedback"></div>
    </div>
</div>

<script>
    // ⚠️ 請替換為您部署 Apps Script 後取得的 Web App URL
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

    // 發送資料至 Google Sheet 後端的通用函式
    function sendDataToSheet(action, detail) {
        const studentId = document.getElementById('studentId').value.trim() || '未填寫姓名';

        const payload = {
            studentId: studentId,
            action: action,
            detail: detail
        };

        // 使用 no-cors 模式確保跨網域請求不會阻擋
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        }).then(() => {
            console.log('紀錄已成功傳送至 Google Sheet');
        }).catch(err => {
            console.error('傳送紀錄時發生錯誤:', err);
        });
    }

    // 按鈕點擊紀錄
    function logAction(action, detail) {
        sendDataToSheet(action, detail);
        alert('已記錄您的閱讀狀態！');
    }

    // 測驗提交處理
    function submitQuiz() {
        const answer = document.getElementById('quizAnswer').value;
        const feedbackEl = document.getElementById('quizFeedback');

        if (!answer) {
            alert('請先選擇答案！');
            return;
        }

        let isCorrect = (answer === 'KANO');
        let detailText = `選擇了：${answer} (${isCorrect ? '正確' : '錯誤'})`;

        if (isCorrect) {
            feedbackEl.innerText = '恭喜你！答對了，嘉農棒球隊英文縮寫為 KANO。';
        } else {
            feedbackEl.innerText = '答錯囉，再試試看！';
        }

        sendDataToSheet('隨堂測驗', detailText);
    }

    // 心得提交處理
    function submitReflection() {
        const reflectionText = document.getElementById('reflection').value.trim();
        const feedbackEl = document.getElementById('reflectionFeedback');

        if (!reflectionText) {
            alert('請輸入心得再送出！');
            return;
        }

        sendDataToSheet('提交心得', reflectionText);
        feedbackEl.innerText = '心得已成功送出！謝謝你的分享。';
        document.getElementById('reflection').value = '';
    }
</script>

</body>
</html>
