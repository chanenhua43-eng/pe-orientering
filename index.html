            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);

        }

        .main-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #333;
        }

            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-random {
            background-color: #0284c7;
            margin-bottom: 10px;
        }

        .map-card {
            background-color: var(--map-card-bg);
            border-radius: 20px;
            padding: 20px;
            color: white;
            margin-bottom: 25px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }

        .map-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .map-img-box {
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
        }

        .map-img-box img {
            width: 100%;
            height: auto;
            display: block;
        }

            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);

            justify-content: center;
            align-items: center;
            font-size: 1rem;

            <div id="step2Feedback" class="feedback-msg hidden"></div>
        </div>

            </div>

</div>

    }

        currentList = routesData[currentRouteKey];
        currentIndex = 0;

        document.getElementById('setupSection').classList.add('hidden');
        document.getElementById('challengeSection').classList.remove('hidden');
        document.getElementById('routeBadge').innerText = `${currentRouteKey} 版地圖`;

        startTimer();
        sendToSheet('開始探索', `選擇了 ${currentRouteKey} 版路線`);

        loadCP(currentIndex);
    }

    function loadCP(idx) {
        const cp = currentList[idx];
        document.getElementById('cpBadgeText').innerText = `CP ${idx + 1}`;
        document.getElementById('cpLocationText').innerText = cp.location;

        // 隱藏步驟二與步驟三，只開啟步驟一
        document.getElementById('step2Card').classList.add('hidden');
        document.getElementById('step3Card').classList.add('hidden');

        // 重置欄位與圖片
        document.getElementById('photoInputStep1').value = '';
        document.getElementById('previewStep1').classList.add('hidden');
        document.getElementById('answerInput').value = '';
        document.getElementById('step2Feedback').classList.add('hidden');

        // 照片/運動任務區域重置
        document.getElementById('taskPhotoArea').classList.add('hidden');
        document.getElementById('taskExerciseArea').classList.add('hidden');
        document.getElementById('photoInputTask').value = '';
        document.getElementById('previewTask').classList.add('hidden');
        document.getElementById('heartRateInput').value = '';
        document.getElementById('taskCheck').checked = false;

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function previewImg(inputId, previewId) {
        const input = document.getElementById(inputId);
        const preview = document.getElementById(previewId);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function submitStep1() {
        const fileInput = document.getElementById('photoInputStep1');
        if (!fileInput.files || !fileInput.files[0]) {
            alert('請拍攝並上傳打卡照片！');
            return;
        }

        const cp = currentList[currentIndex];
        sendToSheet(`打卡拍照 (CP ${currentIndex + 1})`, `地點: ${cp.location}`);

        // 解鎖步驟二
        document.getElementById('questionText').innerText = cp.question;
        document.getElementById('step2Card').classList.remove('hidden');
        alert('打卡成功！解鎖步驟二問題。');
    }

    function submitStep2() {
        const userAns = document.getElementById('answerInput').value.trim();
        const cp = currentList[currentIndex];
        const feedback = document.getElementById('step2Feedback');

        if (!userAns) { alert('請輸入答案！'); return; }

        const isCorrect = (userAns.toLowerCase().replace(/\s+/g, '') === cp.answer.toLowerCase().replace(/\s+/g, ''));

        if (isCorrect) {
            feedback.className = 'feedback-msg success';
            feedback.innerText = '🎉 答對了！已解鎖步驟三體態挑戰任務。';
            feedback.classList.remove('hidden');

            sendToSheet(`回答問題 (CP ${currentIndex + 1})`, `地點: ${cp.location} | 正確答案: ${userAns}`);

            // 解鎖步驟三
            document.getElementById('taskText').innerText = cp.task;
            if (cp.requirePhoto) document.getElementById('taskPhotoArea').classList.remove('hidden');
            if (cp.isExercise) document.getElementById('taskExerciseArea').classList.remove('hidden');

            document.getElementById('step3Card').classList.remove('hidden');
        } else {
            feedback.className = 'feedback-msg error';
            feedback.innerText = '❌ 答案不正確，請再試一次！';
            feedback.classList.remove('hidden');
            sendToSheet(`回答問題 (CP ${currentIndex + 1})`, `地點: ${cp.location} | 錯誤答案: ${userAns}`);
        }
    }

    function submitStep3() {
        const cp = currentList[currentIndex];

        if (cp.requirePhoto) {
            const taskInput = document.getElementById('photoInputTask');
            if (!taskInput.files || !taskInput.files[0]) {
                alert('本關卡為照片任務，請拍攝並上傳合照相片！');
                return;
            }
        }

        let hrValue = '';
        if (cp.isExercise) {
            hrValue = document.getElementById('heartRateInput').value.trim();
            if (!hrValue) {
                alert('本關卡為運動任務，請填寫運動後的即時心跳率 (BPM)！');
                return;
            }
        }

        if (!document.getElementById('taskCheck').checked) {
            alert('請勾選確認完成任務！');
            return;
        }

        let detailLog = `地點: ${cp.location} | 任務完成: ${cp.task}`;
        if (cp.requirePhoto) detailLog += ' (含任務照片)';
        if (cp.isExercise) detailLog += ` | 心跳率: ${hrValue} BPM`;

        sendToSheet(`完成關卡 (CP ${currentIndex + 1})`, detailLog);

        currentIndex++;

        if (currentIndex >= currentList.length) {
            clearInterval(timerInterval);
            document.getElementById('challengeSection').classList.add('hidden');
            document.getElementById('completedSection').classList.remove('hidden');
            document.getElementById('finalTimeDisplay').innerText = `總耗時：${document.getElementById('timerDisplay').innerText}`;
            sendToSheet('全程通關', `完成了全部 11 個 CP 點，總耗時: ${document.getElementById('timerDisplay').innerText}`);
        } else {
            alert(`恭喜完成 CP ${currentIndex}！即將載入 CP ${currentIndex + 1}`);
            loadCP(currentIndex);
        }
    }

    function sendToSheet(action, detail) {
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                studentId: studentId || '未紀錄',
                route: currentRouteKey || '未知',
                action: action,
                detail: detail
            })
        }).then(() => console.log('紀錄傳送成功')).catch(err => console.error(err));
    }
</script>

</body>
