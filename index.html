<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘉義大學蘭潭校區 - 定向越野順點式解謎與體態挑戰</title>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #2d6a4f;
            --accent: #d8f3dc;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #38b000;
            --warning: #ffb703;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 15px;
            color: var(--dark);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .card {
            background: var(--light);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            border-left: 6px solid var(--secondary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }

        .btn:hover {
            background-color: var(--primary);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #495057;
        }

        .btn-random {
            background-color: #0077b6;
        }

        .btn-random:hover {
            background-color: #03045e;
        }

        .step-box {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px dashed #adb5bd;
        }

        .badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .task-box {
            background: #e8f5e9;
            border-left: 4px solid var(--success);
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .feedback {
            margin-top: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.error {
            color: #d90429;
        }

        .hidden {
            display: none;
        }

        .img-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .progress-bar-bg {
            background: #e9ecef;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>嘉義大學蘭潭校區<br>定向越野與體態挑戰 SPA</h1>

    <!-- 進度條 -->
    <div id="progressContainer" class="hidden">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
            <span>整體探索進度</span>
            <span id="progressText">0 / 11 點</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- 步驟 1: 登錄與路線選擇 -->
    <div id="setupSection" class="card">
        <span class="badge">步驟 1 / 2</span>
        <h2>學生身分與地圖路線設定</h2>
        
        <label for="studentId">請輸入姓名或組別：</label>
        <input type="text" id="studentId" placeholder="例如：體育系張小明 / 第一組">

        <label for="routeSelect">選擇或分配地圖路線：</label>
        <select id="routeSelect">
            <option value="">-- 請選擇地圖路線 --</option>
            <option value="A">A 版地圖路線</option>
            <option value="B">B 版地圖路線</option>
            <option value="C">C 版地圖路線</option>
            <option value="D">D 版地圖路線</option>
        </select>

        <button class="btn btn-random" onclick="randomRoute()">🎲 隨機分配地圖路線</button>
        <button class="btn" onclick="startChallenge()" style="margin-top: 12px;">🚀 開始定向越野挑戰</button>
    </div>

    <!-- 步驟 2: 挑戰進行區域 -->
    <div id="challengeSection" class="hidden">
        <div class="card" style="background: #e2eafc; border-left-color: #0077b6;">
            <strong>目前狀態：</strong><span id="studentInfoDisplay"></span><br>
            <strong>目前地圖路線：</strong><span id="routeInfoDisplay"></span>
        </div>

        <div id="checkpointsContainer"></div>
    </div>

    <!-- 完成畫面 -->
    <div id="completedSection" class="card hidden" style="text-align: center; border-left-color: var(--success);">
        <h2 style="color: var(--success);">🎉 恭喜完成所有 11 個挑戰點！</h2>
        <p>您的挑戰紀錄與相片打卡資料已成功傳送至後端 Google Sheet 資料庫。</p>
        <button class="btn" onclick="location.reload()">重新開始 / 換人操作</button>
    </div>
</div>

    let currentStudentId = '';
    let currentRouteKey = '';
    let currentRouteList = [];
    let currentPointIndex = 0;

    function randomRoute() {
        const keys = ['A', 'B', 'C', 'D'];
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        document.getElementById('routeSelect').value = randomKey;
        alert(`已隨機分配為：${randomKey} 版地圖路線！`);
    }

    function startChallenge() {
        const studentId = document.getElementById('studentId').value.trim();
        const routeKey = document.getElementById('routeSelect').value;

        if (!studentId) {
            alert('請輸入您的姓名或組別！');
            return;
        }
        if (!routeKey) {
            alert('請選擇或隨機分配地圖路線！');
            return;
        }

        currentStudentId = studentId;
        currentRouteKey = routeKey;
        currentRouteList = routesData[routeKey];
        currentPointIndex = 0;

        document.getElementById('setupSection').classList.add('hidden');
        document.getElementById('progressContainer').classList.remove('hidden');
        document.getElementById('challengeSection').classList.remove('hidden');

        document.getElementById('studentInfoDisplay').innerText = currentStudentId;
        document.getElementById('routeInfoDisplay').innerText = `${currentRouteKey} 版地圖`;

        sendToGoogleSheet('開始探索', `選擇了 ${currentRouteKey} 版路線`);

        renderCheckpoints();
        updateProgressBar();
    }

    function renderCheckpoints() {
        const container = document.getElementById('checkpointsContainer');
        container.innerHTML = '';

        currentRouteList.forEach((point, idx) => {
            const isCurrent = idx === currentPointIndex;
            const isPassed = idx < currentPointIndex;
            const isLocked = idx > currentPointIndex;

            const card = document.createElement('div');
            card.className = 'card';
            if (isLocked) {
                card.style.opacity = '0.5';
                card.style.borderLeftColor = '#6c757d';
            } else if (isPassed) {
                card.style.borderLeftColor = 'var(--success)';
            }

            let html = `
                <span class="badge" style="${isPassed ? 'background:var(--success)' : (isLocked ? 'background:#6c757d' : '')}">
                    ${isPassed ? '✓ 已完成' : (isLocked ? '🔒 鎖定中' : '📍 目前目標點')} - 第 ${idx + 1} 點
                </span>
                <h2>地點：${point.location}</h2>
            `;

            if (isPassed) {
                html += `<p style="color:var(--success); font-weight:bold;">已成功上傳打卡照片、答對問題，並完成體能任務！</p>`;
            } else if (isCurrent) {
                html += `
                    <!-- 步驟 A: 上傳照片 -->
                    <div class="step-box">
                        <label>第一步：到達地點拍照打卡上傳</label>
                        <input type="file" id="photoInput_${idx}" accept="image/*" onchange="previewImage('photoInput_${idx}', 'imgPreview_${idx}')">
                        <img id="imgPreview_${idx}" class="img-preview hidden">
                        <button class="btn btn-secondary" onclick="uploadPhoto(${idx})" style="margin-top:8px;">📸 確認上傳地點打卡照片</button>
                    </div>

                    <!-- 步驟 B: 顯示問題與答題 -->
                    <div id="quizBox_${idx}" class="step-box hidden">
                        <label>第二步：回答地點問題</label>
                        <p><strong>問題：</strong>${point.question}</p>
                        <input type="text" id="answerInput_${idx}" placeholder="請在此輸入答案...">
                        <button class="btn" onclick="submitAnswer(${idx})">驗證答案</button>
                        <div id="quizFeedback_${idx}" class="feedback"></div>
                    </div>

                    <!-- 步驟 C: 體態任務挑戰 -->
                    <div id="taskBox_${idx}" class="task-box hidden">
                        <label style="color:var(--primary);">第三步：出現體態挑戰任務！</label>
                        <p style="font-size:1.1rem; font-weight:bold; color:#1b4332;">🏋️ 任務：${point.task}</p>
                        
                        ${point.requirePhoto ? `
                            <div style="background:#fff; padding:10px; border-radius:6px; margin:10px 0; border:1px solid #c8e6c9;">
                                <label style="color:#d90429;">📷 本關卡任務需上傳挑戰照片：</label>
                                <input type="file" id="taskPhotoInput_${idx}" accept="image/*" onchange="previewImage('taskPhotoInput_${idx}', 'taskImgPreview_${idx}')">
                                <img id="taskImgPreview_${idx}" class="img-preview hidden">
                            </div>
                        ` : ''}

                        <label><input type="checkbox" id="taskCheck_${idx}"> 我們已完成此項任務！</label>
                        <button class="btn" onclick="completePoint(${idx})" style="margin-top:10px;">✅ 完成此點，進入下一點</button>
                    </div>
                `;
            } else {
                html += `<p style="color:#6c757d;">請先完成前面的檢查點以解鎖此任務。</p>`;
            }

            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    function previewImage(inputId, previewId) {
        const fileInput = document.getElementById(inputId);
        const preview = document.getElementById(previewId);
        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
            }
            reader.readAsDataURL(fileInput.files[0]);
        }
    }

    function uploadPhoto(idx) {
        const fileInput = document.getElementById(`photoInput_${idx}`);
        if (!fileInput.files || !fileInput.files[0]) {
            alert('請先選擇或拍攝現場打卡照片！');
            return;
        }

        const point = currentRouteList[idx];
        sendToGoogleSheet(`照片打卡 (第${idx+1}點)`, `地點: ${point.location} - 地點照片已上傳`);

        alert('地點照片打卡成功！已解鎖問題區域。');
        document.getElementById(`quizBox_${idx}`).classList.remove('hidden');
    }

    function submitAnswer(idx) {
        const userInput = document.getElementById(`answerInput_${idx}`).value.trim();
        const point = currentRouteList[idx];
        const feedbackEl = document.getElementById(`quizFeedback_${idx}`);

        if (!userInput) {
            alert('請輸入答案！');
            return;
        }

        const isCorrect = (userInput.toLowerCase().replace(/\s+/g, '') === point.answer.toLowerCase().replace(/\s+/g, ''));

        if (isCorrect) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.innerText = '🎉 答對了！任務解鎖中...';
            sendToGoogleSheet(`回答問題 (第${idx+1}點)`, `地點: ${point.location} | 答對: ${userInput}`);
            
            setTimeout(() => {
                document.getElementById(`taskBox_${idx}`).classList.remove('hidden');
            }, 500);
        } else {
            feedbackEl.className = 'feedback error';
            feedbackEl.innerText = '❌ 答案不正確，請再試試看！';
            sendToGoogleSheet(`回答問題 (第${idx+1}點)`, `地點: ${point.location} | 答錯: ${userInput}`);
        }
    }

    function completePoint(idx) {
        const point = currentRouteList[idx];

        if (point.requirePhoto) {
            const taskFileInput = document.getElementById(`taskPhotoInput_${idx}`);
            if (!taskFileInput || !taskFileInput.files || !taskFileInput.files[0]) {
                alert('本關卡任務需要上傳挑戰照片，請先選擇或拍攝任務照片！');
                return;
            }
        }

        const checkEl = document.getElementById(`taskCheck_${idx}`);
        if (!checkEl.checked) {
            alert('請勾選確認已完成任務！');
            return;
        }

        sendToGoogleSheet(`完成任務 (第${idx+1}點)`, `地點: ${point.location} | 任務: ${point.task} ${point.requirePhoto ? '(包含任務照片)' : ''}`);

        currentPointIndex++;
        updateProgressBar();

        if (currentPointIndex >= currentRouteList.length) {
            document.getElementById('challengeSection').classList.add('hidden');
            document.getElementById('completedSection').classList.remove('hidden');
            sendToGoogleSheet('全程通關', `完成了 ${currentRouteKey} 版地圖全部 11 個檢查點！`);
        } else {
            renderCheckpoints();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    }

    function updateProgressBar() {
        const total = currentRouteList.length || 11;
        const pct = Math.round((currentPointIndex / total) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressText').innerText = `${currentPointIndex} / ${total} 點 (${pct}%)`;
    }

    function sendToGoogleSheet(action, detail) {
        const payload = {
            studentId: currentStudentId || '未記錄學生',
            route: currentRouteKey || '未知路線',
            action: action,
            detail: detail
        };

        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        }).then(() => {
            console.log('資料已即時傳送至 Google Sheet');
        }).catch(err => {
            console.error('傳送至 Google Sheet 失敗:', err);
        });
    }
</script>

</body>
</html>
